[package]
name = "ph-today"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fframes = { version = "=1.2.0", features = ["compile-time-svgtree", "cli"] }
fframes_skia_renderer = { version = "=1.2.0", features = ["vulkan"] }
fframes_native_player = { version = "=1.2.0", default-features = false, features = ["vulkan", "audio"] }
# fframes 1.2.0 only builds against the 1.2.0 media crates (1.3 moved to a newer usvgr).
fframes-media = "=1.2.0"
fframes-media-dir-macro = "=1.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(windows))'.dependencies]
fframes = { version = "=1.2.0", features = ["h264", "libav-agree-gpl"] }

[lib]
name = "ph_today"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "ph-today"
path = "src/main.rs"

[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

